name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - name: 태그와 Cargo.toml, npm package.json 버전 일치 확인
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(sed -nE 's/^version = "(.*)"/\1/p' crates/cli/Cargo.toml | head -1)
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag != crates/cli/Cargo.toml version $version" >&2
            exit 1
          fi
          for pkg in npm/rust-markdownlint npm/platforms/*; do
            v=$(node -p "require('./$pkg/package.json').version")
            if [ "$tag" != "$v" ]; then
              echo "tag v$tag != $pkg/package.json version $v" >&2
              exit 1
            fi
          done
          node -e '
            const deps = require("./npm/rust-markdownlint/package.json").optionalDependencies;
            const bad = Object.entries(deps).filter(([, v]) => v !== process.argv[1]);
            if (bad.length) { console.error("optionalDependencies not at " + process.argv[1] + ":", bad); process.exit(1); }
          ' "$tag"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y musl-tools
      - run: cargo build --release -p rust-markdownlint-cli --target ${{ matrix.target }}
      - name: 아카이브와 sha256
        shell: bash
        run: |
          name="rust-markdownlint-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p dist
          if [ "${{ runner.os }}" = Windows ]; then
            asset="$name.zip"
            7z a "dist/$asset" "./target/${{ matrix.target }}/release/rust-markdownlint.exe" > /dev/null
          else
            asset="$name.tar.gz"
            tar czf "dist/$asset" -C "target/${{ matrix.target }}/release" rust-markdownlint
          fi
          cd dist && (sha256sum "$asset" 2> /dev/null || shasum -a 256 "$asset") > "$asset.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes dist/*

  publish-npm:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: 플랫폼 패키지에 바이너리 복사
        run: |
          set -e
          v="$GITHUB_REF_NAME"
          extract() {
            tar xzf "dist/rust-markdownlint-$v-$2.tar.gz" -C "npm/platforms/$1"
            chmod +x "npm/platforms/$1/rust-markdownlint"
          }
          extract darwin-arm64 aarch64-apple-darwin
          extract darwin-x64 x86_64-apple-darwin
          extract linux-x64 x86_64-unknown-linux-musl
          extract linux-arm64 aarch64-unknown-linux-musl
          unzip -o "dist/rust-markdownlint-$v-x86_64-pc-windows-msvc.zip" -d npm/platforms/win32-x64
          ls -l npm/platforms/*/
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: npm publish (플랫폼 5개, 그 다음 메인)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -e
          # 경로에 ./ 를 붙여야 함. 없으면 npm 이 npm/rust-markdownlint 를 GitHub 저장소 축약형으로 해석함
          for pkg in ./npm/platforms/*; do
            npm publish --access public --provenance "$pkg"
          done
          npm publish --access public --provenance ./npm/rust-markdownlint
