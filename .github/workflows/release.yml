name: Release

on:
  push:
    # v0, v0.1 같은 액션 태그는 제외 (release 잡이 옮긴다)
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  # 수동 실행은 항상 리허설이다. 빌드, 아카이브, sha256, npm 패키징까지 그대로 하고
  # 릴리즈 생성과 실제 publish 만 건너뛴다. 태그를 밀기 전에 경로 전체를 검증하는 용도.
  workflow_dispatch:
    inputs:
      version:
        description: "리허설할 버전. crates/cli/Cargo.toml 과 같아야 한다 (예: v0.1.1)"
        required: true
  # tag.yml 이 버전 범프를 감지해 태그를 민 뒤 여기를 직접 부른다.
  # GITHUB_TOKEN 으로 push 한 태그는 위의 push 트리거를 발화시키지 않기 때문에 호출로 잇는다.
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # 태그 push 면 태그 이름, 수동 실행이면 입력값
  VERSION: ${{ inputs.version || github.ref_name }}
  # 수동 실행이면 리허설
  REHEARSAL: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - name: 버전이 13곳에서 일치하는지
        shell: bash
        run: bash scripts/check-version.sh "$VERSION"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y musl-tools
      - run: cargo build --release -p rust-markdownlint-cli --target ${{ matrix.target }}
      - name: 아카이브와 sha256
        shell: bash
        run: |
          name="rust-markdownlint-${VERSION}-${{ matrix.target }}"
          mkdir -p dist
          if [ "${{ runner.os }}" = Windows ]; then
            asset="$name.zip"
            7z a "dist/$asset" "./target/${{ matrix.target }}/release/rust-markdownlint.exe" > /dev/null
          else
            asset="$name.tar.gz"
            tar czf "dist/$asset" -C "target/${{ matrix.target }}/release" rust-markdownlint
          fi
          cd dist && (sha256sum "$asset" 2> /dev/null || shasum -a 256 "$asset") > "$asset.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: 자산 목록과 sha256 (리허설이면 여기까지)
        run: |
          ls -l dist
          cat dist/*.sha256
          test "$(ls dist/*.tar.gz | wc -l)" -eq 4
          test "$(ls dist/*.zip | wc -l)" -eq 1
      - if: env.REHEARSAL != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --generate-notes dist/*
      - if: env.REHEARSAL != 'true'
        uses: actions/checkout@v4
      - name: 액션 태그 이동 (v0, v0.1 → 이 릴리즈)
        if: env.REHEARSAL != 'true'
        run: |
          major="${VERSION%%.*}"
          minor="${VERSION%.*}"
          # $VERSION 태그 이름 대신 SHA 를 쓴다. workflow_call 로 불릴 때는 체크아웃이 main 이라
          # 태그가 로컬에 없다. 두 경로 모두 GITHUB_SHA 가 릴리즈 커밋이다.
          git tag -f "$major" "$GITHUB_SHA"
          git tag -f "$minor" "$GITHUB_SHA"
          git push -f origin "$major" "$minor"

  publish-npm:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: 플랫폼 패키지에 바이너리 복사
        run: |
          set -e
          v="$VERSION"
          extract() {
            tar xzf "dist/rust-markdownlint-$v-$2.tar.gz" -C "npm/platforms/$1"
            chmod +x "npm/platforms/$1/rust-markdownlint"
          }
          extract darwin-arm64 aarch64-apple-darwin
          extract darwin-x64 x86_64-apple-darwin
          extract linux-x64 x86_64-unknown-linux-musl
          extract linux-arm64 aarch64-unknown-linux-musl
          unzip -o "dist/rust-markdownlint-$v-x86_64-pc-windows-msvc.zip" -d npm/platforms/win32-x64
          ls -l npm/platforms/*/
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: npm publish (플랫폼 5개, 그 다음 메인)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -e
          # 리허설은 --dry-run. provenance 는 OIDC 교환이 필요해 리허설에서 뺀다.
          if [ "$REHEARSAL" = true ]; then
            flags="--dry-run --access public"
          else
            flags="--access public --provenance"
          fi
          # 경로에 ./ 를 붙여야 함. 없으면 npm 이 npm/rust-markdownlint 를 GitHub 저장소 축약형으로 해석함
          for pkg in ./npm/platforms/*; do
            npm publish $flags "$pkg"
          done
          npm publish $flags ./npm/rust-markdownlint
