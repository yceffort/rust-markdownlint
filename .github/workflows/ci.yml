name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # 버전 문자열이 13곳에서 일치하는지. 릴리즈 때가 아니라 PR 에서 잡는다.
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-version.sh

  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # action.yml 을 이 저장소에 적용 (최신 릴리즈 바이너리를 내려받아 문서를 lint)
  action:
    name: action.yml (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          globs: |
            README.md
            docs/*.md
            npm/**/README.md
            bench/RESULTS.md

  # .pre-commit-hooks.yaml 의 script 훅. 훅은 crates/cli/Cargo.toml 버전의 릴리즈 자산을 내려받는데
  # 버전을 올리는 PR 에서는 그 릴리즈가 아직 없으므로, 이 체크아웃을 빌드해 같은 이름으로 묶고
  # file:// 로 받게 한다 (실제 릴리즈 다운로드 경로는 위 action 잡이 검증한다).
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p rust-markdownlint-cli
      - name: 릴리즈 자산 모양으로 묶기
        run: |
          version="v$(sed -nE 's/^version = "(.*)"/\1/p' crates/cli/Cargo.toml | head -1)"
          asset="rust-markdownlint-$version-x86_64-unknown-linux-musl.tar.gz"
          mkdir -p "dist/$version"
          tar czf "dist/$version/$asset" -C target/release rust-markdownlint
          (cd "dist/$version" && sha256sum "$asset" > "$asset.sha256")
          echo "RUST_MARKDOWNLINT_DOWNLOAD_BASE=file://$PWD/dist" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install pre-commit
      - run: pre-commit try-repo . rust-markdownlint --files README.md docs/cli2-scenarios.md
