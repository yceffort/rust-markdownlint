[workspace]
resolver = "3"
members = ["crates/markdown-rs", "crates/core", "crates/cli"]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
markdown = { path = "crates/markdown-rs" }
rust-markdownlint = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
jsonc-parser = { version = "0.33", features = ["serde"] }
serde-saphyr = "1"
similar = "2"
toml = "1"
regex = "1"
fancy-regex = "0.19"
unicode-width = "0.2"
thiserror = "2"
anyhow = "1"
globset = "0.4"
lsp-server = "0.10"
lsp-types = "0.97"
ignore = "0.4"
rayon = "1"
sha2 = "0.10"
insta = { version = "1", features = ["yaml", "json"] }
assert_cmd = "2"
predicates = "3"
tempfile = "3"
